# GitLab Pages 部署配置
# 将 main 分支推送到 GitLab 后自动部署到 Pages
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp *.html public/
    - cp *.css public/ 2>/dev/null || true
    - cp *.js public/ 2>/dev/null || true
    - cp *.svg public/ 2>/dev/null || true
    - cp *.png public/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  only:
    - main
