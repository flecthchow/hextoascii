<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hex 与文本（UTF-8）实时互转，纯浏览器本地计算，不上传数据。">
  <title>Hex ↔ ASCII 转换器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c3aed'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='13' font-weight='700' fill='white' text-anchor='middle'%3E0x%3C/text%3E%3C/svg%3E">
  <style>
    /* === 主题变量 === */
    :root {
      color-scheme: light dark;
      --bg: #f0f2f5;
      --panel: #fff;
      --text: #1a1a2e;
      --text-2: #333;
      --muted: #6b7280;
      --border: #e5e7eb;
      --border-hover: #cbd0d8;
      --field: #fafbfc;
      --seg: #f3f4f6;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-soft: #ede9fe;
      --accent-ring: rgba(124,58,237,.15);
      --blue: #2563eb;
      --blue-soft: #dbeafe;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
      --danger-border: #fecaca;
      --ok: #059669;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1117;
        --panel: #181b23;
        --text: #e5e7eb;
        --text-2: #d1d5db;
        --muted: #9ca3af;
        --border: #2a2f3a;
        --border-hover: #3b4250;
        --field: #12151c;
        --seg: #12151c;
        --accent: #a78bfa;
        --accent-hover: #8b5cf6;
        --accent-soft: rgba(167,139,250,.15);
        --accent-ring: rgba(167,139,250,.25);
        --blue: #60a5fa;
        --blue-soft: rgba(96,165,250,.15);
        --danger: #fca5a5;
        --danger-soft: rgba(239,68,68,.12);
        --danger-border: rgba(239,68,68,.35);
        --ok: #34d399;
        --shadow: 0 1px 3px rgba(0,0,0,.4);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
    }

    /* === Header === */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header .badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 12px;
      font-size: 12px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    /* === Panel === */
    .panel {
      background: var(--panel);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 20px 22px;
    }

    /* === 选项栏 === */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 24px;
      margin-bottom: 16px;
    }

    .opt-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .opt-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
    }

    .seg {
      display: inline-flex;
      flex-wrap: wrap;
      background: var(--seg);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .seg-btn {
      padding: 6px 12px;
      font: 500 13px "SF Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace;
      color: var(--muted);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }

    .seg-btn:hover:not([aria-checked="true"]) { color: var(--text); }

    .seg-btn[aria-checked="true"] {
      background: var(--panel);
      color: var(--accent);
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-2);
      cursor: pointer;
      user-select: none;
    }

    .check input {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .check code {
      font-family: "SF Mono", Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
    }

    /* === 双栏 === */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .pane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .pane-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: 700 12px "SF Mono", Consolas, monospace;
    }

    .icon-hex  { background: var(--accent-soft); color: var(--accent); }
    .icon-text { background: var(--blue-soft); color: var(--blue); }

    .stat {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* === Textarea === */
    textarea {
      flex: 1;
      width: 100%;
      min-height: 260px;
      padding: 12px 14px;
      font-family: "SF Mono", "Fira Code", "Cascadia Code", Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.6;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      resize: vertical;
      transition: border-color .15s, box-shadow .15s;
      background: var(--field);
      color: var(--text);
      word-break: break-all;
    }

    textarea::placeholder { color: var(--muted); opacity: .8; }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
      background: var(--panel);
    }

    textarea.invalid,
    textarea.invalid:focus {
      border-color: var(--danger-border);
      box-shadow: 0 0 0 3px var(--danger-soft);
    }

    /* === Buttons === */
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      background: var(--panel);
      color: var(--text-2);
      border: 1.5px solid var(--border);
    }

    .btn:hover { border-color: var(--border-hover); background: var(--field); }
    .btn:active { transform: scale(.98); }
    .btn.copied { color: var(--ok); border-color: var(--ok); }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* === 错误提示 === */
    .msg {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-top: 10px;
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid var(--danger-border);
      word-break: break-all;
    }

    .msg[hidden] { display: none; }

    /* === Footer === */
    .hint, .footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.8;
    }

    .hint { margin-top: 16px; }
    .footer { margin-top: 8px; opacity: .8; }
    .footer a { color: inherit; }

    /* === Responsive === */
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      textarea { min-height: 160px; }
    }

    @media (max-width: 500px) {
      body { padding: 20px 12px; }
      .header h1 { font-size: 22px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- ====== Header ====== -->
    <div class="header">
      <h1>Hex &#x2194; ASCII 转换器</h1>
      <span class="badge">内网工具 · 纯浏览器计算 · 不上传数据</span>
    </div>

    <!-- ====== 选项 ====== -->
    <div class="panel toolbar">
      <div class="opt-group">
        <span class="opt-label" id="fmtLabel">Hex 输出格式</span>
        <div class="seg" role="radiogroup" aria-labelledby="fmtLabel" id="fmtGroup">
          <button type="button" class="seg-btn" role="radio" data-fmt="space">48 65</button>
          <button type="button" class="seg-btn" role="radio" data-fmt="compact">4865</button>
          <button type="button" class="seg-btn" role="radio" data-fmt="0x">0x48 0x65</button>
          <button type="button" class="seg-btn" role="radio" data-fmt="c">0x48, 0x65</button>
          <button type="button" class="seg-btn" role="radio" data-fmt="esc">\x48\x65</button>
        </div>
      </div>
      <div class="opt-group">
        <label class="check"><input type="checkbox" id="optUpper"> 大写</label>
        <label class="check"><input type="checkbox" id="optEscape"> 转义不可见字符 <code>\r \n \t \xNN</code></label>
      </div>
    </div>

    <!-- ====== 双栏：Hex / 文本 ====== -->
    <div class="grid">
      <div class="panel pane">
        <div class="pane-head">
          <label class="pane-title" for="hexInput"><span class="icon icon-hex">0x</span>Hex</label>
          <span class="stat" id="hexStat"></span>
        </div>
        <textarea id="hexInput" spellcheck="false" autocomplete="off"
          placeholder="粘贴十六进制，格式自动识别：&#10;48 65 6c 6c 6f&#10;48656c6c6f&#10;0x48, 0x65, 0x6c&#10;\x48\x65\x6c&#10;48:65:6c / 48-65-6c"></textarea>
        <div id="hexError" class="msg" role="alert" hidden></div>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" data-copy="hexInput">复制</button>
          <button type="button" class="btn" data-action="clear">清空</button>
          <button type="button" class="btn" data-action="sample">填入示例</button>
        </div>
      </div>

      <div class="panel pane">
        <div class="pane-head">
          <label class="pane-title" for="textInput"><span class="icon icon-text">Aa</span>文本 (UTF-8)</label>
          <span class="stat" id="textStat"></span>
        </div>
        <textarea id="textInput" spellcheck="false" autocomplete="off"
          placeholder="在此输入普通文本，支持中文 / emoji…"></textarea>
        <div class="btn-row">
          <button type="button" class="btn btn-primary" data-copy="textInput">复制</button>
          <button type="button" class="btn" data-action="clear">清空</button>
        </div>
      </div>
    </div>

    <p class="hint">两侧实时互转，在任意一侧输入即可 · 开启「转义」后，文本侧也可直接输入 <code>\r\n</code>、<code>\x00</code> 等</p>
    <div class="footer">
      数据仅在浏览器本地处理，不会上传到任何服务器 &nbsp;|&nbsp; <a href="https://github.com/flecthchow/hextoascii" target="_blank" rel="noopener">GitHub</a>
    </div>

  </div>

  <script>
    // ========================
    // 状态
    // ========================
    const $ = id => document.getElementById(id);
    const hexEl = $('hexInput');
    const textEl = $('textInput');
    const utf8Encoder = new TextEncoder();
    const utf8Decoder = new TextDecoder();

    const FORMATS = {
      space:   { prefix: '',   sep: ' ' },
      compact: { prefix: '',   sep: ''  },
      '0x':    { prefix: '0x', sep: ' ' },
      c:       { prefix: '0x', sep: ', ' },
      esc:     { prefix: '\\x', sep: '' },
    };

    const PREFS_KEY = 'hextoascii.prefs';
    const prefs = { fmt: 'space', upper: false, escape: true };
    let bytes = new Uint8Array(0);   // 唯一数据源，两侧都由它渲染
    let hexValid = true;

    function loadPrefs() {
      try {
        const saved = JSON.parse(localStorage.getItem(PREFS_KEY)) || {};
        if (saved.fmt in FORMATS) prefs.fmt = saved.fmt;
        if (typeof saved.upper === 'boolean') prefs.upper = saved.upper;
        if (typeof saved.escape === 'boolean') prefs.escape = saved.escape;
      } catch (e) { /* 隐私模式等场景下忽略 */ }
    }

    function savePrefs() {
      try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
    }

    // ========================
    // Hex 解析（自动识别格式）
    // 支持: "48 65"、"4865"、"0x48,0x65"、"\x48\x65"、"48:65"、"48-65"、"{0x48, 0x65};"
    // ========================
    function parseHex(input) {
      const tokens = input
        .replace(/0x|\\x/gi, ' ')
        .split(/[\s,;:{}\[\]\-]+/)
        .filter(Boolean);

      const out = [];
      for (const t of tokens) {
        const shown = t.length > 20 ? t.slice(0, 20) + '…' : t;
        if (!/^[0-9a-f]+$/i.test(t)) {
          return { error: `无效的十六进制值: "${shown}"` };
        }
        if (t.length === 1) {          // 单个半字节，如 "a" → 0x0a
          out.push(parseInt(t, 16));
          continue;
        }
        if (t.length % 2 !== 0) {
          return { error: `"${shown}" 长度为奇数，无法按每 2 个字符一个字节拆分` };
        }
        for (let i = 0; i < t.length; i += 2) {
          out.push(parseInt(t.substring(i, i + 2), 16));
        }
      }
      return { bytes: Uint8Array.from(out) };
    }

    function byteToHex(b) {
      const h = b.toString(16).padStart(2, '0');
      return prefs.upper ? h.toUpperCase() : h;
    }

    function formatHex(data) {
      const { prefix, sep } = FORMATS[prefs.fmt];
      const parts = new Array(data.length);
      for (let i = 0; i < data.length; i++) parts[i] = prefix + byteToHex(data[i]);
      return parts.join(sep);
    }

    // ========================
    // 字节 → 文本
    // 转义模式下手动解码 UTF-8：控制字符显示为 \r \n \t \xNN，
    // 非法 UTF-8 字节显示为 \xNN，保证可以无损转回
    // ========================
    const NAMED_ESCAPES = { 0x09: '\\t', 0x0a: '\\n', 0x0d: '\\r', 0x5c: '\\\\' };

    function renderCodePoint(cp) {
      if (cp in NAMED_ESCAPES) return NAMED_ESCAPES[cp];
      if (cp < 0x20 || cp === 0x7f) return '\\x' + byteToHex(cp);
      return String.fromCodePoint(cp);
    }

    function decodeEscaped(data) {
      let out = '';
      let i = 0;
      while (i < data.length) {
        const b = data[i];
        let n = 0, cp = -1;
        if (b < 0x80)                    { n = 1; cp = b; }
        else if (b >= 0xc2 && b <= 0xdf) { n = 2; cp = b & 0x1f; }
        else if (b >= 0xe0 && b <= 0xef) { n = 3; cp = b & 0x0f; }
        else if (b >= 0xf0 && b <= 0xf4) { n = 4; cp = b & 0x07; }

        if (n > 1) {
          if (i + n > data.length) {
            cp = -1;
          } else {
            for (let k = 1; k < n; k++) {
              const c = data[i + k];
              if ((c & 0xc0) !== 0x80) { cp = -1; break; }
              cp = (cp << 6) | (c & 0x3f);
            }
          }
          // 过长编码、代理区、超出 Unicode 范围均视为非法
          if (cp !== -1 && ((n === 3 && cp < 0x800) ||
                            (n === 4 && (cp < 0x10000 || cp > 0x10ffff)) ||
                            (cp >= 0xd800 && cp <= 0xdfff))) {
            cp = -1;
          }
        }

        if (cp === -1) {
          out += '\\x' + byteToHex(b);
          i += 1;
        } else {
          out += renderCodePoint(cp);
          i += n;
        }
      }
      return out;
    }

    // ========================
    // 文本 → 字节（转义模式下解析 \r \n \t \0 \\ \xNN）
    // ========================
    const SIMPLE_ESCAPES = { n: 0x0a, r: 0x0d, t: 0x09, '0': 0x00, '\\': 0x5c };

    function encodeEscaped(str) {
      const out = [];
      let buf = '';
      const flush = () => {
        if (!buf) return;
        for (const b of utf8Encoder.encode(buf)) out.push(b);
        buf = '';
      };

      for (let i = 0; i < str.length; i++) {
        const c = str[i];
        if (c === '\\' && i + 1 < str.length) {
          const d = str[i + 1];
          if (d in SIMPLE_ESCAPES) {
            flush();
            out.push(SIMPLE_ESCAPES[d]);
            i += 1;
            continue;
          }
          const hh = str.substring(i + 2, i + 4);
          if ((d === 'x' || d === 'X') && /^[0-9a-fA-F]{2}$/.test(hh)) {
            flush();
            out.push(parseInt(hh, 16));
            i += 3;
            continue;
          }
        }
        buf += c;   // 不认识的转义按普通字符处理
      }
      flush();
      return Uint8Array.from(out);
    }

    // ========================
    // 渲染
    // ========================
    function renderHex() {
      hexEl.value = formatHex(bytes);
      setHexError('');
    }

    function renderText() {
      textEl.value = prefs.escape ? decodeEscaped(bytes) : utf8Decoder.decode(bytes);
    }

    function renderStats() {
      let chars = 0;
      for (const _ of utf8Decoder.decode(bytes)) chars++;
      $('hexStat').textContent = `${bytes.length} 字节`;
      $('textStat').textContent = `${chars} 字符`;
    }

    function setHexError(msg) {
      hexValid = !msg;
      const el = $('hexError');
      el.textContent = msg;
      el.hidden = !msg;
      hexEl.classList.toggle('invalid', !!msg);
      hexEl.setAttribute('aria-invalid', msg ? 'true' : 'false');
    }

    function renderOptions() {
      document.querySelectorAll('#fmtGroup .seg-btn').forEach(btn => {
        const on = btn.dataset.fmt === prefs.fmt;
        btn.setAttribute('aria-checked', on);
        btn.tabIndex = on ? 0 : -1;
      });
      $('optUpper').checked = prefs.upper;
      $('optEscape').checked = prefs.escape;
    }

    function setBytes(data) {
      bytes = data;
      renderHex();
      renderText();
      renderStats();
    }

    // ========================
    // 事件
    // ========================
    hexEl.addEventListener('input', () => {
      const r = parseHex(hexEl.value);
      if (r.error) {
        setHexError(r.error);   // 保留上一次有效结果，等用户改正
        return;
      }
      setHexError('');
      bytes = r.bytes;
      renderText();
      renderStats();
    });

    textEl.addEventListener('input', () => {
      bytes = prefs.escape ? encodeEscaped(textEl.value) : utf8Encoder.encode(textEl.value);
      renderHex();
      renderStats();
    });

    $('fmtGroup').addEventListener('click', e => {
      const btn = e.target.closest('.seg-btn');
      if (!btn) return;
      prefs.fmt = btn.dataset.fmt;
      savePrefs();
      renderOptions();
      if (hexValid) renderHex();
    });

    // 单选组方向键切换
    $('fmtGroup').addEventListener('keydown', e => {
      const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
      if (!(e.key in keys)) return;
      e.preventDefault();
      const btns = [...document.querySelectorAll('#fmtGroup .seg-btn')];
      const idx = btns.findIndex(b => b.dataset.fmt === prefs.fmt);
      const next = btns[(idx + keys[e.key] + btns.length) % btns.length];
      next.click();
      next.focus();
    });

    $('optUpper').addEventListener('change', e => {
      prefs.upper = e.target.checked;
      savePrefs();
      if (hexValid) renderHex();
      if (prefs.escape) renderText();
    });

    $('optEscape').addEventListener('change', e => {
      prefs.escape = e.target.checked;
      savePrefs();
      renderText();
    });

    document.addEventListener('click', e => {
      const btn = e.target.closest('button[data-action], button[data-copy]');
      if (!btn) return;
      if (btn.dataset.copy) {
        copyText($(btn.dataset.copy).value, btn);
      } else if (btn.dataset.action === 'clear') {
        setBytes(new Uint8Array(0));
      } else if (btn.dataset.action === 'sample') {
        setBytes(utf8Encoder.encode('Hello, 世界!\r\n'));
      }
    });

    // ========================
    // 复制（http 内网环境下 Clipboard API 不可用时回退到 execCommand）
    // ========================
    async function copyText(text, btn) {
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      const original = btn.dataset.label ??= btn.textContent;
      btn.textContent = '已复制 ✓';
      btn.classList.add('copied');
      clearTimeout(btn._timer);
      btn._timer = setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    }

    // ========================
